name: macOS CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check toolchain and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -d "$DEVELOPER_DIR"
          swift --version
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a version tag such as v0.1.0" >&2; exit 1; }
            echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi
      - name: Unit and application tests
        run: ./scripts/test.sh
      - name: HTTP loopback integration tests
        run: ./scripts/test-integration.sh
      - name: CLIProxyAPI isolated integration test
        run: python3 scripts/test-cli-proxy.py
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Package DMG, ZIP and checksums
        run: ./scripts/package-release.sh
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AIHub-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download both architecture packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: AIHub-macos-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish development preview
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          cd dist
          for arch in arm64 x86_64; do
            test -f "AIHub-$version-$arch.dmg"
            test -f "AIHub-$version-$arch.zip"
            sha256sum --check "AIHub-$version-$arch.sha256"
          done
          cat > release-notes.md <<'NOTES'
          AIHub 开发预览，支持 macOS 14 及以上。

          - Apple Silicon（M 系列）下载 arm64；Intel Mac 下载 x86_64。
          - DMG 内将 AIHub 拖到 Applications，或解压 ZIP 后手动复制。
          - 当前为 ad-hoc 签名，尚未 Apple 公证；首次启动可能被 Gatekeeper 拦截。不要关闭系统安全检查。
          - 真实账号、API 和中文 ASR 仍需验收；请勿当作正式稳定版。
          - 校验文件仅验证下载完整性，不等同于 Apple 身份签名。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.zip ./*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" ./*.dmg ./*.zip ./*.sha256 \
              --verify-tag --title "AIHub $version · 开发预览" \
              --prerelease --generate-notes --notes-file release-notes.md
          fi
